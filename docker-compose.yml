# Local Postgres for development and tests. Run: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sitelog
      POSTGRES_PASSWORD: sitelog
      POSTGRES_DB: sitelog
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sitelog']
      interval: 2s
      retries: 15

volumes:
  postgres-data:
